<title>GAME WORKS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* レイアウト：黄色いおもちゃ箱の上にゲームのパッケージが並ぶ棚。クリックでパッケージが開き、下へスクロールして詳細を読む */
:root{
  --sun:#ffc93c;          /* 背景の黄色 */
  --sun-deep:#f5ad1b;     /* 背景のドット */
  --ink:#232041;          /* 文字・ふち */
  --paper:#fffaf0;        /* 説明書の紙 */
  --shell:#fbfbfd;        /* パッケージのプラスチック */
  --shell-edge:#d9dbe6;
  --pop:#ff5d73;          /* アクセント（ピンク） */
  --sky:#5ec8f2;
  --muted:#6b6785;
  --f-display:"Dela Gothic One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-dot:"DotGothic16","MS Gothic",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--sun);color:var(--ink)}
body{
  font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.75;
  background-color:var(--sun);
  background-image:radial-gradient(var(--sun-deep) 2.2px,transparent 2.6px);
  background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}

/* ---------- ヘッダー ---------- */
.top{max-width:1120px;margin:0 auto;padding-block:40px 8px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.logo{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(44px,9vw,92px);line-height:.95;letter-spacing:.01em;color:#fff;
  text-shadow:3px 3px 0 var(--ink),6px 6px 0 var(--pop);-webkit-text-stroke:2px var(--ink);transform:rotate(-2deg);text-wrap:balance}
.logo small{display:block;font-size:.32em;-webkit-text-stroke:0;color:var(--ink);text-shadow:none;letter-spacing:.2em;margin-top:10px;font-family:var(--f-dot)}
.who{background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-weight:700;font-size:14px;box-shadow:4px 4px 0 var(--pop)}
.who b{font-family:var(--f-display);font-weight:400;letter-spacing:.06em}

/* ---------- 絞り込み ---------- */
.filters{max-width:1120px;margin:22px auto 0;display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:5px 16px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:3px 3px 0 var(--pop)}

/* ---------- パッケージの棚 ---------- */
.shelf{max-width:1120px;margin:28px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:40px 30px;padding-bottom:30px}
.case{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:14px;min-width:0}
.case:focus-visible{outline:3px solid var(--ink);outline-offset:8px;border-radius:14px}
.case .shell{transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
.case:hover .shell,.case:focus-visible .shell{transform:translateY(-8px) rotate(-1.5deg);box-shadow:10px 14px 0 rgba(35,32,65,.9)}
.case:nth-child(even):hover .shell{transform:translateY(-8px) rotate(1.5deg)}
.case[hidden]{display:none}
.case.soon{cursor:default}
.case.soon:hover .shell{transform:none;box-shadow:6px 8px 0 rgba(35,32,65,.9)}

/* パッケージ本体（共通部品：棚と開いた画面の両方で使う） */
.shell{position:relative;width:100%;max-width:100%;aspect-ratio:1.12/1;background:var(--shell);border:3px solid var(--ink);border-radius:12px;
  padding:7% 20% 6% 5%;display:flex;box-shadow:6px 8px 0 rgba(35,32,65,.9)}
.shell::before{content:"";position:absolute;inset:2.5% 1.6%;border:2px solid var(--shell-edge);border-radius:7px;pointer-events:none}
.art{position:relative;flex:1;min-width:0;border:2px solid var(--ink);border-radius:3px;overflow:hidden;background:var(--c,var(--pop))}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.band{position:absolute;top:0;right:0;bottom:0;width:15%;background:var(--c,var(--pop));border-left:2px solid var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14% 0 16%;border-radius:0 8px 8px 0}
.band .mark{width:66%;aspect-ratio:1;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(9px,1.1vw,13px);line-height:1}
.band .vt{writing-mode:vertical-rl;font-family:var(--f-display);color:#fff;font-size:clamp(11px,1.5vw,17px);letter-spacing:.08em;-webkit-text-stroke:1px var(--ink);white-space:nowrap}
.tag{position:absolute;left:4%;bottom:3%;font-family:var(--f-dot);font-size:clamp(9px,1vw,11px);background:var(--ink);color:#fff;padding:0 6px;border-radius:3px;z-index:1}

/* 画像がまだ無いときの仮の絵 */
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px;color:#fff;
  background:
    linear-gradient(transparent 92%,rgba(0,0,0,.08) 92%) 0 0/100% 12px,
    radial-gradient(circle at 25% 30%,rgba(255,255,255,.35) 0 18%,transparent 19%),
    radial-gradient(circle at 80% 75%,rgba(255,255,255,.22) 0 22%,transparent 23%),
    var(--c,var(--pop))}
.ph strong{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(18px,2.6vw,30px);line-height:1.1;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);text-wrap:balance}
.ph span{display:inline-block;margin-top:8px;font-family:var(--f-dot);font-size:11px;background:rgba(35,32,65,.75);border-radius:4px;padding:1px 8px}

.meta{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px;min-width:0}
.meta h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.meta p{margin:0;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.pill{font-size:12px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:#fff;white-space:nowrap}

/* ---------- プロフィール ---------- */
.about{max-width:1120px;margin:30px auto 0;padding-block:0 56px}
.about-card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:24px clamp(18px,4vw,36px);display:grid;grid-template-columns:auto 1fr;gap:20px 28px;align-items:center}
.about-card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.about-card p{margin:4px 0 0;max-width:62ch}
.avatar{width:84px;height:84px;border-radius:50%;border:3px solid var(--ink);background:var(--sky);display:grid;place-items:center;font-family:var(--f-dot);font-size:30px;color:#fff;-webkit-text-stroke:1px var(--ink)}
.skills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.yt{display:inline-flex;align-items:center;gap:10px;margin-top:16px;text-decoration:none;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;
  padding:6px 18px 6px 6px;font-weight:900;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;max-width:100%}
.yt:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.yt:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.yt .play{flex:none;width:38px;height:28px;border-radius:9px;background:var(--pop);border:2px solid var(--ink);display:grid;place-items:center}
.yt .play::before{content:"";border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.yt small{display:block;font-family:var(--f-dot);font-size:11px;font-weight:400;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.yt span{line-height:1.3;min-width:0}
.yt.off{opacity:.55;pointer-events:none}
footer{text-align:center;font-family:var(--f-dot);font-size:12px;padding-block:0 30px;color:var(--ink)}
@media (max-width:520px){.about-card{grid-template-columns:1fr}}

/* ---------- 開いたパッケージ ---------- */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(35,32,65,.72);backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
.viewer.show{opacity:1}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
  padding:calc(70px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.close{position:fixed;z-index:60;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));
  border:3px solid var(--ink);background:#fff;border-radius:999px;padding:6px 16px 6px 12px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 var(--pop);display:flex;gap:6px;align-items:center}
.close:hover{background:var(--sun)}

.stage{--w:min(42vw,330px);display:flex;justify-content:center;perspective:1600px;padding-bottom:30px}
.book{position:relative;width:calc(var(--w)*2);height:calc(var(--w)/1.12);transform:translateX(calc(var(--w)/-2)) scale(.9);transition:transform .7s cubic-bezier(.6,0,.2,1)}
.viewer.show .book{transform:translateX(calc(var(--w)/-2)) scale(1)}
.book.open,.viewer.show .book.open{transform:translateX(0) scale(1)}
.tray,.cover{position:absolute;top:0;left:var(--w);width:var(--w);height:100%}
.tray{background:#eef0f6;border:3px solid var(--ink);border-radius:0 12px 12px 0;box-shadow:6px 8px 0 rgba(0,0,0,.35);display:grid;place-items:center;
  background-image:repeating-linear-gradient(90deg,transparent 0 10px,rgba(35,32,65,.04) 10px 11px)}
.slot{width:62%;aspect-ratio:1/1.12;border-radius:10px;background:#d8dbe6;box-shadow:inset 0 3px 6px rgba(35,32,65,.35);display:grid;place-items:center}
.cart{width:84%;aspect-ratio:1/1.12;background:#3b3a52;border:2px solid var(--ink);border-radius:8px;clip-path:polygon(0 0,82% 0,100% 12%,100% 100%,0 100%);
  padding:9% 9% 22%;position:relative;transform:translateY(0);transition:transform .5s .55s cubic-bezier(.3,1.6,.5,1)}
.book.open .cart{transform:translateY(-6%) rotate(-3deg)}
.cart .art{height:100%;border-radius:4px}
.cart::after{content:"";position:absolute;left:14%;right:14%;bottom:6%;height:9%;background:repeating-linear-gradient(90deg,#f5c84a 0 5px,transparent 5px 8px)}
.cart .ph strong{font-size:clamp(11px,1.6vw,17px);-webkit-text-stroke:1px var(--ink);text-shadow:2px 2px 0 var(--ink)}
.cart .ph span{display:none}

.cover{transform-origin:left center;transform-style:preserve-3d;transition:transform .85s .25s cubic-bezier(.55,0,.2,1);z-index:2}
.book.open .cover{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front .shell{height:100%;aspect-ratio:auto;box-shadow:none}
.face.back{transform:rotateY(180deg);background:var(--paper);border:3px solid var(--ink);border-radius:12px 0 0 12px;padding:9% 9%;display:flex;flex-direction:column;justify-content:space-between;
  background-image:linear-gradient(var(--paper),var(--paper)),repeating-linear-gradient(0deg,transparent 0 18px,#f0e6cf 18px 19px);background-clip:padding-box}
.face.back .kicker{font-family:var(--f-dot);font-size:clamp(10px,1.3vw,13px);color:var(--muted)}
.face.back h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(16px,2.6vw,30px);line-height:1.15;color:var(--c);-webkit-text-stroke:1px var(--ink);text-wrap:balance;overflow-wrap:anywhere}
.face.back .catch{margin:0;font-weight:900;font-size:clamp(11px,1.5vw,16px);line-height:1.5}
.face.back .hint{font-family:var(--f-dot);font-size:clamp(10px,1.2vw,12px);display:flex;gap:6px;align-items:center}
.face.back .hint i{font-style:normal;display:inline-block;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}

/* ---------- 詳細（説明書） ---------- */
.manual{max-width:820px;margin:0 auto;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:8px 8px 0 var(--ink);overflow:hidden;
  opacity:0;transform:translateY(30px);transition:opacity .5s .9s,transform .5s .9s}
.viewer.show .manual.in{opacity:1;transform:none}
.m-head{background:var(--c);border-bottom:3px solid var(--ink);padding:22px clamp(18px,4vw,40px);color:#fff}
.m-head .eyebrow{font-family:var(--f-dot);font-size:13px;color:var(--ink);background:#fff;display:inline-block;padding:0 8px;border-radius:4px;border:2px solid var(--ink)}
.m-head h2{margin:8px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,52px);line-height:1.05;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);overflow-wrap:anywhere}
.m-head p{margin:10px 0 0;font-weight:900;color:var(--ink);font-size:17px}
.m-body{padding:8px clamp(18px,4vw,40px) 36px}
.sec{padding-block:24px;border-bottom:2px dashed #e3d7bd}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 12px;font-family:var(--f-display);font-weight:400;font-size:19px;display:flex;align-items:center;gap:10px}
.sec h3::before{content:"";width:14px;height:14px;background:var(--c);border:2.5px solid var(--ink);transform:rotate(45deg)}
.sec p{margin:0;max-width:62ch}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0}
.spec div{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;min-width:0}
.spec dt{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.08em}
.spec dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.feat{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:14px 16px;min-width:0}
.feat b{display:block;font-weight:900;font-size:16px;line-height:1.4;margin-bottom:4px}
.feat p{font-size:14px;color:#3d3a5c}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.shot{position:relative;aspect-ratio:16/9;max-width:100%;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--c)}
.shot .art{position:absolute;inset:0;border:0;border-radius:0;background:#111}
.shot img{width:100%;height:100%;object-fit:contain;display:block}
.shot .ph strong{font-size:16px}
.keys{display:flex;flex-direction:column;gap:8px}
.keyrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
kbd{font-family:var(--f-dot);font-size:14px;min-width:38px;text-align:center;padding:3px 10px 5px;background:#fff;border:2px solid var(--ink);border-radius:7px;box-shadow:0 4px 0 var(--ink)}
.dl{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:30px}
.dl a{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#fff;background:var(--pop);border:3px solid var(--ink);border-radius:999px;
  padding:14px 34px;font-family:var(--f-display);font-size:clamp(18px,3vw,24px);box-shadow:0 7px 0 var(--ink);transition:transform .1s,box-shadow .1s;-webkit-text-stroke:1px var(--ink)}
.dl a:hover{transform:translateY(2px);box-shadow:0 5px 0 var(--ink)}
.dl a:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.dl a.off{background:#b9b6cc;pointer-events:none}
.dl small{color:var(--muted);font-weight:700}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s!important;transition-delay:0s!important;animation:none!important}
}
</style>

<header class="top">
  <h1 class="logo">GAME<br>WORKS<small>▶ PRESS START</small></h1>
  <div class="who" id="who"></div>
</header>

<nav class="filters" id="filters" aria-label="作品の絞り込み"></nav>
<main class="shelf" id="shelf"></main>

<section class="about">
  <div class="about-card">
    <div class="avatar" aria-hidden="true" id="avatar">?</div>
    <div>
      <h2>ABOUT ME</h2>
      <p id="aboutText"></p>
      <div class="skills" id="skills"></div>
      <a class="yt" id="yt" target="_blank" rel="noopener"><i class="play" aria-hidden="true"></i><span>YouTubeチャンネル<small id="ytName"></small></span></a>
    </div>
  </div>
</section>
<footer id="foot"></footer>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <button class="close" id="closeBtn" type="button">✕ とじる</button>
  <div class="scroll" id="scroll">
    <div class="stage"><div class="book" id="book"></div></div>
    <article class="manual" id="manual"></article>
  </div>
</div>

<script>
/* =========================================================
   ここを書きかえるだけで中身が変わります
   ・cover   … パッケージに入れるゲーム画面（例："images/key-escape.png"）
   ・shots   … 詳細ページのスクリーンショット（何枚でもOK）
   ・download… ダウンロードページのURL（"" のままならボタンは押せません）
   ========================================================= */
const SITE = {
  name: "宮本幸太郎",
  initial: "宮",
  about: "大原学園熊本情報ITクリエイター専門学校 ゲーム・クリエイター学科で、ゲーム開発を学んでいます。Unityで個人制作・チーム制作の両方を経験し、企画から実装、完成まで取り組んできました。YouTubeでは登録者30,000人規模のチャンネルを運営し、遊ぶ人・見る人の視点で考える力を培いました。",
  skills: ["Unity", "C#", "C++", "C", "HTML", "CSS", "PHP", "GitHub", "動画編集"],
  youtube: "https://www.youtube.com/@wakason",                     // ← チャンネルのURL（例："https://www.youtube.com/@○○○"）
  youtubeName: "@wakason",    // ← ボタンに小さく出すチャンネル名
  copyright: "© 2026 Kotaro Miyamoto Portfolio"
};

const GAMES = [
  {
    id: "key-escape",
    title: "KEY ESCAPE",
    sub: "キーエスケープ",
    color: "#ff5d73",
    tags: ["2Dアクション", "個人制作"],
    pick: true,                       // ← 「おススメ」に出すなら true
    status: "試作品",
    cover: "images/key-escape.jpg",
    catch: "逃げ出したキーボードを、取り戻せ。",
    story: "人間に酷使されたキーボードたちが、ある日みんなで家を飛び出した。キーをひとつも持たなくなった主人公は、逃げ遅れたKキーと出会い、散らばったキーを探しに外の世界へ向かう。",
    spec: [
      ["ジャンル", "2Dアクション"],
      ["対応機種", "PC（Windows）"],
      ["エンジン", "Unity / C#"],
      ["制作", "個人制作"],
      ["ステージ", "Chapter 1（全7ステージ＋ボス）"],
      ["担当", "企画・プログラム・ステージ制作"]
    ],
    features: [
      ["キーを集めて、操作をつくる", "拾ったキーを「右に移動」「ジャンプ」などのアクションに割り当てて、自分だけの操作を組み立てる。1キー＝1アクションが基本ルール。"],
      ["暴走したキーを鎮める", "エラーを起こして敵になったキーを倒すと、仲間として戻ってくる。隠れているキーを見つけて拾うこともできる。"],
      ["ギミックのあるステージ", "流れる川、レバーで架かる跳ね橋、攻撃で壊せる石、レーザーと落石。持っているキーで攻略の仕方が変わる。"],
      ["巨大なAキーとのボス戦", "檻でキーを封じられたら、その場でキー設定を組み替えて戦い続ける。"]
    ],
    controls: [["Tab", "キー設定をひらく"], ["Esc", "設定"], ["F", "調べる・話す"], ["?", "移動やジャンプは、拾ったキーで自由に決める"]],
    shots: ["images/key-escape-1.jpg", "images/key-escape-2.jpg", "images/key-escape-3.jpg", "images/key-escape-4.jpg", "images/key-escape-5.jpg"],              // ← スクリーンショットを入れる
    download: "https://github.com/MiyamotoooooO/Portfolio/releases/download/games-v1/KeyEscape.zip"
  },
  {
    id: "canvas-city",
    title: "キャンバスシティ",
    sub: "CANVAS CITY",

/* ---------- ここから下は仕組み ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function artHTML(g, src, label) {
  const img = src ? `<img src="${esc(src)}" alt="${esc(g.title)} のゲーム画面" loading="lazy">` : "";
  const ph = src ? "" : `<div class="ph"><div><strong>${esc(g.title)}</strong><span>${label}</span></div></div>`;
  return `<div class="art">${img}${ph}</div>`;
}
function shellHTML(g) {
  return `<div class="shell" style="--c:${g.color}">
    ${artHTML(g, g.cover, "ゲーム画面をここに")}
    <span class="tag">${esc(g.status || "")}</span>
    <div class="band"><span class="mark">宮</span><span class="vt">GAME WORKS</span></div>
  </div>`;
}

/* ヘッダーとプロフィール */
$("#who").innerHTML = `portfolio of <b>${esc(SITE.name)}</b>`;
$("#avatar").textContent = SITE.initial;
$("#aboutText").textContent = SITE.about;
$("#skills").innerHTML = SITE.skills.map(s => `<span class="pill">${esc(s)}</span>`).join("");
$("#foot").textContent = SITE.copyright;
const yt = $("#yt");
if (SITE.youtube) { yt.href = SITE.youtube; $("#ytName").textContent = SITE.youtubeName; }
else { yt.classList.add("off"); yt.setAttribute("aria-disabled", "true"); $("#ytName").textContent = "URLを設定してください"; }

/* 棚 */
$("#shelf").innerHTML = GAMES.map(g => `
  <button class="case${g.soon ? " soon" : ""}" type="button" data-id="${g.id}" data-tags="${esc([...g.tags, ...(g.pick ? ["おススメ"] : [])].join(","))}" ${g.soon ? 'aria-disabled="true"' : ""} aria-label="${esc(g.title)}${g.soon ? "（準備中）" : " をひらく"}">
    ${shellHTML(g)}
    <div class="meta"><h2>${esc(g.title)}</h2><p>${esc(g.tags.join(" / "))}</p></div>
  </button>`).join("");

/* 絞り込み */
const allTags = ["すべて", "おススメ", "個人制作", "チーム制作"];
$("#filters").innerHTML = allTags.map((t, i) => `<button class="chip" type="button" aria-pressed="${i === 0}">${esc(t)}</button>`).join("");
$("#filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  const t = b.textContent;
  document.querySelectorAll(".case").forEach(c => { c.hidden = t !== "すべて" && !c.dataset.tags.split(",").includes(t); });
});

/* 開く・閉じる */
const viewer = $("#viewer"), book = $("#book"), manual = $("#manual");
let lastFocus = null, closing = null;

function openGame(id, fromHash) {
  const g = GAMES.find(x => x.id === id);
  if (!g || g.soon) return;
  clearTimeout(closing);
  lastFocus = document.activeElement;
  viewer.style.setProperty("--c", g.color);

  book.className = "book";
  book.innerHTML = `
    <div class="tray"><div class="slot"><div class="cart">${artHTML(g, g.cover, "")}</div></div></div>
    <div class="cover">
      <div class="face front">${shellHTML(g)}</div>
      <div class="face back" style="--c:${g.color}">
        <span class="kicker">INSTRUCTION BOOKLET</span>
        <h3>${esc(g.title)}</h3>
        <p class="catch">${esc(g.catch)}</p>
        <span class="hint"><i>▼</i> 下にスクロール</span>
      </div>
    </div>`;

  const shots = (g.shots || []).map((s, i) => `<div class="shot">${artHTML(g, s, "スクリーンショット " + (i + 1))}</div>`).join("");
  manual.className = "manual";
  manual.innerHTML = `
    <header class="m-head">
      <span class="eyebrow">${esc(g.status)}</span>
      <h2 id="mTitle">${esc(g.title)}</h2>
      <p>${esc(g.catch)}</p>
    </header>
    <div class="m-body">
      <section class="sec"><h3>どんなゲーム？</h3><p>${esc(g.story)}</p></section>
      <section class="sec"><h3>作品データ</h3><dl class="spec">${g.spec.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></section>
      <section class="sec"><h3>見どころ</h3><div class="feats">${g.features.map(([t, d]) => `<div class="feat"><b>${esc(t)}</b><p>${esc(d)}</p></div>`).join("")}</div></section>
      ${shots ? `<section class="sec"><h3>スクリーンショット</h3><div class="shots">${shots}</div></section>` : ""}
      ${g.controls ? `<section class="sec"><h3>操作</h3><div class="keys">${g.controls.map(([k, d]) => `<div class="keyrow"><kbd>${esc(k)}</kbd><span>${esc(d)}</span></div>`).join("")}</div></section>` : ""}
      <section class="sec dl">
        <a href="${esc(g.download || "#")}" target="_blank" rel="noopener" class="${g.download ? "" : "off"}">⬇ ダウンロード</a>
        <small>${g.download ? "zipファイルのダウンロードが始まります（Windows向け）" : "ダウンロードは準備中です"}</small>
      </section>
    </div>`;

  viewer.hidden = false;
  document.body.classList.add("lock");
  $("#scroll").scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    viewer.classList.add("show");
    setTimeout(() => { book.classList.add("open"); manual.classList.add("in"); }, 350);
  }));
  $("#closeBtn").focus({ preventScroll: true });
  if (!fromHash && location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
}

function closeGame() {
  if (viewer.hidden) return;
  book.classList.remove("open");
  manual.classList.remove("in");
  setTimeout(() => viewer.classList.remove("show"), 450);
  closing = setTimeout(() => {
    viewer.hidden = true;
    document.body.classList.remove("lock");
    if (lastFocus) lastFocus.focus({ preventScroll: true });
  }, 750);
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
}

$("#shelf").addEventListener("click", e => { const c = e.target.closest(".case"); if (c) openGame(c.dataset.id); });
$("#closeBtn").addEventListener("click", closeGame);
$("#scroll").addEventListener("click", e => { if (e.target.id === "scroll" || e.target.classList.contains("stage")) closeGame(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeGame(); });
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); id ? openGame(id, true) : closeGame(); });
if (location.hash.length > 1) openGame(location.hash.slice(1), true);
</script>
